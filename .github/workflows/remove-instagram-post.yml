name: Remove Instagram gallery post

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Instagram media ID to remove from the gallery"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove post and block future re-imports
        run: python3 scripts/remove-instagram-post.py "${{ inputs.post_id }}"

      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/removed-posts.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Remove Instagram gallery post ${{ inputs.post_id }}"
            git push
          fi
