name: Moderate hashtag post

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "The post ID from data/pending-posts.json"
        required: true
        type: string
      decision:
        description: "Approve or reject this hashtag post"
        required: true
        type: choice
        options:
          - approve
          - reject

permissions:
  contents: write

jobs:
  moderate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Moderate hashtag post
        run: |
          python3 scripts/moderate-hashtag.py \
            "${{ inputs.post_id }}" \
            "${{ inputs.decision }}"

      - name: Commit moderation decision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/posts.json data/pending-posts.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Moderate hashtag post ${{ inputs.post_id }}"
            git push
          fi
